aid: upsie
name: Upsie
description: >-
  Upsie is a direct-to-consumer warranty company offering affordable, transparent
  extended-warranty and protection plans for smartphones, laptops, TVs, appliances,
  and other consumer electronics, positioning itself as "the new way to warranty"
  against overpriced retailer protection plans. Alongside its consumer products,
  Upsie operates an independent repair network and publishes the Upsie Partner
  Network API — a JWT-authenticated REST API (api.upsie.com, documented via a
  public Postman collection) that lets repair-network partners create and manage
  repairs, repair items, notes, assignments, and categories, and subscribe to
  webhook events such as repair status updates.
