        ) from the initial login and an account that is properly associated with a repair source (your
        organization). This association is made at account creation or can be requested later for additional
        accounts.
      responses:
        '200':
          description: Successful response (no example published in the collection)
      security:
      - jwtToken: []
      x-postman-request-names:
