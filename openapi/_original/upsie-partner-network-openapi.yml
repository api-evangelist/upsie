paths:
  /partner/repairs:
    post:
      operationId: createRepair
      summary: Create a Repair (all-in-one example)
      tags:
      - Repairs (/repairs)
      requestBody:
        content:
          application/json:
            examples:
              Create-a-Repair--all-in-one-example-:
                summary: Create a Repair (all-in-one example)
                value:
                  requestedTiming: ASAP
                  customer:
                    firstName: Jane
                    lastName: Doe
                    phoneNumber: '5554443333'
                    email: jane.doe@example.com
                  authorizedLimit: 12500
                  category: Smartphones
                  meta:
                    policyNumber: byUs483js
                    model: iPhone 12 mini
                    serial: abc12345
                    imei: '123456789012345'
                    color: black
                    storage: 256gb
                  repairLocationDetails:
                    address: 1 Green Ave, 55105
                    radiusInMiles: 50
                  items:
                  - repairItemTemplateId: 3
                  - description: Front Screen Replacement
                  - description: rear screen rebuffering
              Create-a-Repair--smartphone-example-:
                summary: Create a Repair (smartphone example)
                value:
                  requestedTiming: ASAP
                  customer:
                    firstName: Jane
                    lastName: Doe
                    phoneNumber: '5554443333'
                    email: jane.doe@example.com
                  authorizedLimit: 12500
                  category: Smartphones
                  meta:
                    policyNumber: rwJLHdNo
                    model: iPhone 12 mini
                    serial: abc12345
                    imei: '123456789012345'
                    color: black
                    storage: 256gb
                  repairLocationDetails:
                    address: 3 yellow Ave, 55105
                    radiusInMiles: 50
              Create-a-Repair--minimal-example-:
                summary: Create a Repair (minimal example)
                value:
                  comments: it broke
                  repairStatus: DRAFT
                  requestedTimingId: 1
                  requesterId: 1
                  customerId: 67518
                  warrantyId: 71010
                  categoryId: 1
                  meta:
                    policyNumber: byUs483js
                    serial: abc12345
                    imei: '123456789012345'
                    color: black
                    storage: 256gb
                  repairLocationDetails:
                    postalCode: '55105'
                    address: 1 Green Ave
                    radiusInMiles: 50
      responses:
        '200':
          description: Create a Repair (all-in-one example)
          content:
            application/json:
              examples:
                Create-a-Repair--all-in-one-example-:
                  summary: Create a Repair (all-in-one example)
                  value:
                    id: 24
                    identifier: U0017
                    requestedAt: '2023-04-18T17:36:18.083Z'
                    repairStatus: DRAFT
                    assignmentStatus: PENDING
                    paymentStatus: null
                    repairLocationDetails:
                      address: 1 Green Ave, 55105
                      radiusInMiles: 50
                    comments: null
                    meta:
                      policyNumber: byUs483js
                      model: iPhone 12 mini
                      serial: abc12345
                      imei: '123456789012345'
                      color: black
                      storage: 256gb
                    categoryId: 4
                    repairSourceId: 1
                    authorizedLimit: 12500
                    customerId: 87141
                    allowEditingCustomer: false
                    requestedTimingId: 1
                    smartphoneId: 276
                    activeAssignmentId: null
                    warrantyId: null
                    createdAt: '2023-04-18T17:36:18.083Z'
                    modifiedAt: '2023-04-18T17:36:18.083Z'
                    wasCancelled: null
                    estCompleteDate: null
                    intakeData: null
                    completedAt: null
      security:
      - jwtToken: []
      x-postman-request-names:
      - Create a Repair (all-in-one example)
      - Create a Repair (smartphone example)
      - Create a Repair (minimal example)
    put:
      operationId: createRepairPut
      summary: Create a Repair (non-phone example)
      tags:
      - Repairs (/repairs)
      description: Many of the attributes in the repair object are nullable or assigned at creation or
        update. Below is a sample request body that satisfies the necessary requirements for repair creation.
      requestBody:
        content:
          application/json:
            examples:
              Create-a-Repair--non-phone-example-:
                summary: Create a Repair (non-phone example)
                value:
                  requestedTiming: ASAP
                  customer:
                    firstName: Jane
                    lastName: Doe
                    phoneNumber: '5554443333'
                    email: jane.doe@example.com
                  authorizedLimit: 12500
                  category: Tablets
                  meta:
                    model: iPad Air
                    serial: xyz98765
                    color: black
                    storage: 512gb
                  repairLocationDetails:
                    address: 370 Wabasha St N, 55102
                    radiusInMiles: 50
      responses:
        '200':
          description: Successful response (no example published in the collection)
      security:
      - jwtToken: []
      x-postman-request-names:
      - Create a Repair (non-phone example)
    get:
      operationId: listRepairs
      summary: Get All Repairs
      tags:
      - Repairs (/repairs)
      description: This endpoint returns all repairs regardless of any given status or attriibute. Filtering
        can be done client side or via query params. Documentation of the query param syntax used by the
        Upsie Repair Network API can be found below. Examples are included in the request Params tab.
        Please note that these params serve as examples only. They will not return any results unless
        matching data has been created for this organization. In order to test the included query params,
        create data such that the query is satisfied.
      responses:
        '200':
          description: Successful response (no example published in the collection)
      security:
      - jwtToken: []
      x-postman-request-names:
      - Get All Repairs
  /partner/repairs/{id}:
    get:
      operationId: getRepair
      summary: Get One Repair
      tags:
      - Repairs (/repairs)
      description: This endpoint will return a singular repair object. Include the repair identifier that
        was returned on repair creation as a query param (as seen in the example request) or simply append
        to the url (i.e. partner/repairs/
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Repair id or identifier
      responses:
        '200':
          description: Successful response (no example published in the collection)
      security:
      - jwtToken: []
      x-postman-request-names:
      - Get One Repair
    put:
      operationId: updateRepair
      summary: Update Repair
      tags:
      - Repairs (/repairs)
      description: This endpoint will return a singular repair object. Include the repair identifier that
        was returned on repair creation as a query param (as seen in the example request) or simply append
        to the url (i.e. partner/repairs/
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Repair id or identifier
      requestBody:
