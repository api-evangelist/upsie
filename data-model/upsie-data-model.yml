notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key field
  name; direction is from the entity that owns the reference.

entities:
  - {name: Repair, description: Central object of the repair network; created as DRAFT, submitted as SUBMITTED. Addressable by numeric id or string identifier (e.g. U0017).}
  - {name: RepairItem, description: A line of work on a repair (e.g. Front Screen Replacement); references a template or a free-text description.}
  - {name: RepairItemTemplate, description: Quick-pick common repairs for a category.}
  - {name: RepairAssignment, description: Assignment of a repair to a performing partner; accessible to repair-performing partners only.}
  - {name: RepairNote, description: Communication attached to a repair (from Upsie, the repair source, customer, or partner org).}
  - {name: RepairCategory, description: Category a repair belongs to (e.g. Smartphones); category ids select repair item templates.}
  - {name: Customer, description: The end customer a repair is performed for (firstName, lastName, phoneNumber, email).}
  - {name: PartnerOrganizationWebhook, description: Webhook subscription forwarding events (e.g. repair_status_updated) to a partner URL.}
  - {name: RepairSource, description: Originator of the repair request (repairSourceId on the repair).}
  - {name: Warranty, description: Optional warranty linked to a repair (warrantyId, nullable in documented examples).}

